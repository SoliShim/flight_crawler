name: Deploy static UI to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Pages for workflow deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getPages({ owner, repo });
              core.info('GitHub Pages is already enabled.');
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              core.info('GitHub Pages is not enabled yet. Enabling workflow-based Pages deployment.');
              await github.request('POST /repos/{owner}/{repo}/pages', {
                owner,
                repo,
                build_type: 'workflow',
              });
            }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static UI
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
